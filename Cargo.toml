[package]
name = "llm-check"
version = "0.1.0"
edition = "2024"
description = "Check if LLMs fit your hardware — Apple Silicon & NVIDIA GPU support"
license = "MIT"
repository = "https://github.com/kaushal1717/llm-check"
authors = ["Kaushal Padaliya"]
keywords = ["llm", "gpu", "inference", "apple-silicon", "nvidia"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
clap_complete = "4"
comfy-table = "7.2.2"
dirs = "6.0.0"
dotenvy = "0.15.7"
indicatif = "0.17"
owo-colors = "4"
nvml-wrapper = "0.11.0"
regex = "1.11.1"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.38.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
